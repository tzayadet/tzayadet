name: Refresh profile activity cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/update_profile_activity.py"
      - ".github/workflows/profile-activity.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate activity cards
        run: python scripts/update_profile_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: tzayadet

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity/*.svg
          if git diff --cached --quiet; then
            echo "Activity cards are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile activity cards"
          git push
